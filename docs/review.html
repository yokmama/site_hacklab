<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>クチコミのお願い | キッズプログラミングスクール8x9 東京校</title>

    <link rel="stylesheet" href="css/style.css?v=20261103">
    <style>
        body {
            margin: 0;
            background: #fff;
        }
        .review-page {
            min-height: 100vh;
            min-height: 100dvh;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 16px;
            padding: 24px 16px;
            text-align: center;
        }
        .review-logo {
            width: 96px;
            height: auto;
        }
        .review-title {
            margin: 0;
            font-size: 1.3rem;
            line-height: 1.5;
        }
        .review-qr {
            width: min(80vw, 60vh, 420px);
            height: auto;
            aspect-ratio: 1 / 1;
            image-rendering: pixelated;
        }
        .review-note {
            margin: 0;

            color: var(--color-text-light);

        .review-link {
            font-size: 0.9rem;
        }

</head>
<body>
    <main class="review-page">
        <img src="images/89logo_tokyo.png" alt="キッズプログラミングスクール8x9 東京校" class="review-logo">
        <h1 class="review-title">ご参加ありがとうございました！</h1>
        <img src="images/qr-review.png" alt="Google マップのクチコミ投稿画面を開くQRコード" class="review-qr" width="420" height="420">

        <a class="review-link" href="index.html">トップページへ戻る</a>
    </main>
</body>
</html>
